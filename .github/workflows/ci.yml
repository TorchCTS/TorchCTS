name: CI

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Release hygiene
        run: python scripts/check_release_hygiene.py

      - name: Selftests
        run: python -m pytest -q torchcts/selftest --validation

      - name: Oracle validation
        run: |
          python scripts/oracle_fixtures/verify_manifest.py --check
          python -m pytest -q tests/oracles

      - name: Backend evidence links
        run: python scripts/verify_backend_evidence.py

      - name: Validation collect
        run: python -m pytest --collect-only -q torchcts --validation

      - name: Strict coverage check
        run: |
          python -m torchcts coverage audit
          python -m torchcts coverage check --fail-on-unknown

      - name: Smoke template init
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          python -m torchcts init --template smoke --non-interactive

      - name: Template manifest validation
        run: |
          for manifest in torchcts/templates/manifest.*.py; do
            python -m torchcts check-manifest --manifest "$manifest"
          done

  oracle-routing-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pytorch:
          - "2.7.0"
          - "2.7.1"
          - "2.8.0"
          - "2.9.0"
          - "2.9.1"
          - "2.10.0"
          - "2.11.0"
          - "2.12.0"
          - "2.12.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch ${{ matrix.pytorch }} and TorchCTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${{ matrix.pytorch }}"
          python -m pip install -e .

      - name: Validate permanent-reference routing
        run: |
          python -m pytest -q tests/oracles/test_routing.py
          python -m pytest -q tests/oracles/test_backward.py::test_backward_reference_availability_matches_reviewed_routing_table
